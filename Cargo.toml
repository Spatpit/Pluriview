[package]
name = "pluriview"
version = "0.5.1"
edition = "2021"
description = "Live window preview application with infinite canvas"
authors = ["Spatpit"]
build = "build.rs"

[dependencies]
# UI Framework
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow"
] }
egui = "0.29"
egui-phosphor = "0.7"

# Window Capture
windows-capture = "1.4"

# System Tray
tray-icon = "0.19"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
parking_lot = "0.12"
directories = "5.0"
log = "0.4"
env_logger = "0.11"
url = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
wry = { version = "0.55", default-features = false }
# Same versions wry already pulls in; used to reach ICoreWebView2_8 (audio mute).
webview2-com = "0.38"
# Aliased: `windows_core` must stay 0.58 (matching `windows`) so the audio
# monitor's #[implement] macro resolves against the right version;
# webview2-com interfaces need the 0.61 Interface trait for casts.
webview2-core = { package = "windows-core", version = "0.61" }
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader"
] }

[build-dependencies]
sha2 = "0.10"
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
