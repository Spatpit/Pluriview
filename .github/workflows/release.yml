name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.93.0"

jobs:
  build:
    name: Build Windows release
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update
          rustup component add rustfmt --toolchain $env:RUSTUP_TOOLCHAIN

      - name: Validate version, tag, and release notes
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
              throw "cargo metadata failed with exit code $LASTEXITCODE."
          }

          $version = ($metadata.packages | Where-Object { $_.name -eq "pluriview" } | Select-Object -First 1).version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
              throw "Cargo.toml contains an invalid release version: $version"
          }

          $tag = "v$version"
          $notes = Join-Path "release-notes" "$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
              throw "Missing approved release notes: $notes"
          }

          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_NAME -ne $tag) {
              throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version. Expected $tag."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=Pluriview-$tag-windows-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Prepare pinned runtimes
        shell: pwsh
        run: |
          .\scripts\prepare-angle.ps1
          .\scripts\prepare-libmpv.ps1

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build privacy-safe release archives
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Verify packaged checksums and notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $assets = @(
              "dist\Pluriview-$tag-windows-x64-full.zip",
              "dist\Pluriview-$tag-windows-x64-lite.zip"
          )
          $manifest = Get-Content -LiteralPath "dist\SHA256SUMS.txt"

          foreach ($asset in $assets) {
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                  throw "Missing release asset: $asset"
              }
              $name = Split-Path -Leaf $asset
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
              if ($manifest -notcontains "$hash  $name") {
                  throw "SHA256SUMS.txt does not match $name."
              }
          }

          Copy-Item -LiteralPath "release-notes\$tag.md" -Destination "dist\RELEASE_NOTES.md"

      - name: Attest release artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/Pluriview-v${{ steps.version.outputs.version }}-windows-x64-full.zip
            dist/Pluriview-v${{ steps.version.outputs.version }}-windows-x64-lite.zip
            dist/SHA256SUMS.txt

      - name: Retain release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/Pluriview-v${{ steps.version.outputs.version }}-windows-x64-full.zip
            dist/Pluriview-v${{ steps.version.outputs.version }}-windows-x64-lite.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download attested release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Publish approved release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"
          gh release create "${tag}" \
            "release-assets/Pluriview-${tag}-windows-x64-full.zip" \
            "release-assets/Pluriview-${tag}-windows-x64-lite.zip" \
            "release-assets/SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --fail-on-no-commits \
            --title "Pluriview ${tag}" \
            --notes-file "release-assets/RELEASE_NOTES.md"
